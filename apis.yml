name: Iterative Health (fka Iterative Scopes)
description: 'Iterative Health (formerly Iterative Scopes) is a healthcare and life-sciences
  company that operates an AI-enabled clinical research network, connecting pharmaceutical
  sponsors and contract research organizations (CROs) with community-based medical sites
  across gastroenterology (GI), hepatology, obesity, and cardiology. Its SKOUT product
  applies artificial intelligence to streamline site operations and patient enrollment,
  and the company runs a global site network embedded in community care practices
  through partnerships with GI Alliance, One GI, and US Heart & Vascular. Backed by
  Insight Partners, the company closed a $77M Series C in April 2026. Iterative Health
  does not currently publish a public developer API, SDKs, or developer portal; this
  profile tracks its identity and web presence in the API Evangelist network.'
